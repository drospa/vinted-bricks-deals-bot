name: daily-deals
on:
  schedule:
    # Backup trigger. GitHub cron is UTC-only and was not firing reliably, so the external scheduler
    # is the primary trigger. Both go through the same Madrid-time slot guard in daily_deals.py,
    # so a slot is never processed twice.
    - cron: "35 7 * * *"    # 09:35 Madrid in summer
    - cron: "35 8 * * *"    # 09:35 Madrid in winter
    - cron: "7 12 * * *"    # 14:07 Madrid in summer
    - cron: "7 13 * * *"    # 14:07 Madrid in winter
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: print only, send nothing, save nothing | live: send now | scheduled: used by the external scheduler"
        type: choice
        options:
          - dry-run
          - live
          - scheduled
        default: dry-run

permissions:
  contents: write

concurrency:
  group: daily-deals

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi requests
      - name: Format tests
        run: python -m unittest discover -s tests
      - run: python -u daily_deals.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ inputs.mode }}
      - name: Save state
        if: success() && inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # a catalogue refresh may have pushed meanwhile
          git push
