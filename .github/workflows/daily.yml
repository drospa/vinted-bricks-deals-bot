name: daily-deals
on:
  schedule:
    # GitHub cron is UTC-only. These four cover 09:30 and 14:00 Madrid in both summer (UTC+2)
    # and winter (UTC+1) time; daily_deals.py keeps exactly one run per Madrid slot.
    - cron: "35 7 * * *"    # 09:35 Madrid in summer
    - cron: "35 8 * * *"    # 09:35 Madrid in winter
    - cron: "7 12 * * *"    # 14:07 Madrid in summer
    - cron: "7 13 * * *"    # 14:07 Madrid in winter
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest in the log instead of sending it (state is not saved)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-deals

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi requests
      - run: python -u daily_deals.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Save state
        if: success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
