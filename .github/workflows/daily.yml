name: daily-deals
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 Madrid (summer) / 06:00 (winter); may be delayed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest in the log instead of sending it (state is not saved)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-deals

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi requests
      - run: python -u daily_deals.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Save state
        if: success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
