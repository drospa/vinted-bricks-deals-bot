name: build-catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"   # monthly refresh of prices and retired status

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Catalogue tests
        run: python -m unittest tests.test_catalogue
      - run: python build_catalogue.py
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sets.csv
          git diff --cached --quiet || git commit -m "Update sets catalogue"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # the daily job may have pushed state.json meanwhile
          git push
